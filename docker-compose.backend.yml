services:
  # Spring Boot API 서버
  spring-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spring-backend
    ports:
      - "6030:6030"
    env_file:
      - ./.env.backend
    user: "1000:1000"
    volumes:
      - ./.env.backend:/.env.backend
      - ./backend/uploaded-images:/app/uploaded-images
      - ./backend/logs:/app/logs
    networks:
      - backend-network
    extra_hosts:
      - "host.docker.internal:host-gateway" # 호스트 연결 설정
    restart: unless-stopped

  # FastAPI 챗봇 API 서버
  ai-api:
    build:
      context: ./ai-api
      dockerfile: Dockerfile
    container_name: ai-api
    ports:
      - "8001:8001"
    env_file:
      - ./.env.backend
    volumes:
      # 로그 파일 저장
      - ./chatbot-api/logs:/app/logs
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Node.js 실시간 채팅 서버
  chat-websocket:
    build:
      context: ./chat-websocket
      dockerfile: Dockerfile
    container_name: chat-websocket
    ports:
      - "4000:4000"
    env_file:
      - ./.env.backend
    volumes:
      # 로그 파일 저장
      - ./node-backend/logs:/app/logs
    networks:
      - backend-network
    restart: unless-stopped
    environment:
      - NODE_ENV=production

volumes:
  uploaded-images:
    driver: local

networks:
  backend-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
