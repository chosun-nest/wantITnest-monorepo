version: "3.8"
services:
  mysql:
    image: mysql:8.0.33
    container_name: wantitnest-mysql-container
    restart: unless-stopped # 더 안전한 재시작 정책
    environment:
      MYSQL_ROOT_PASSWORD: "root1234"
      MYSQL_DATABASE: "nest_db"
      MYSQL_USER: "nest"
      MYSQL_PASSWORD: "nest"
      TZ: Asia/Seoul # 타임존 설정
    command: [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-authentication-plugin=mysql_native_password", # 호환성 개선
        "--innodb-buffer-pool-size=256M", # 성능 최적화
        "--max-connections=200",
        "--sql-mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO",
        "--innodb-use-native-aio=1", # 비동기 I/O 활성화
        "--innodb-log-file-size=100M", # 로그 파일 크기 최적화
      ]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysqldata:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro # 읽기 전용으로 마운트
    healthcheck: # 헬스체크 추가
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 30s
    logging: # 로그 설정
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: wnatitnest-redis-container
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Seoul # 타임존 설정
    command: redis-server --appendonly yes # 데이터 영속성
    volumes:
      - ./redisdata:/data

volumes:
  mysqldata:
    driver: local
  redisdata:
    driver: local
